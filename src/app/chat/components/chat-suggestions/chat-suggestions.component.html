<div class="suggestions-wrap"
     *ngIf="shouldShowSuggestions">

  <div class="suggestions-bar" role="list">
    <button
      *ngFor="let s of suggestions; trackBy: trackBySuggestion"
      type="button"
      class="suggestion-btn"
      role="listitem"
      (click)="onApplySuggestion(s)">
      {{ s }}
    </button>
  </div>
</div>
